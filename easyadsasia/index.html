<title>EasyAds Asia</title>

<script>

(function () {

const lang=(navigator.language||"").toLowerCase();

const ruLangs=[
"ru",
"uk",
"be",
"kk",
"uz",
"az",
"hy",
"ka"
];

const isRussianLanguage=ruLangs.some(
code=>lang.startsWith(code)
);

if(isRussianLanguage){

window.location.replace("/ru/easy-ads-asia/");
return;

}

if(lang.startsWith("vi")){

window.location.replace("/vn/easy-ads-asia/");
return;

}

window.location.replace("/en/easy-ads-asia/");

})();

</script>
